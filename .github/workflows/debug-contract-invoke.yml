name: Debug contract invoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-contract-invoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install stellar-cli
        uses: taiki-e/install-action@v2
        with:
          tool: stellar-cli

      - name: Invoke create_expense via CLI (ground truth)
        run: |
          set +e
          {
            echo "contract: $(cat CONTRACT_ID.txt)"
            stellar keys generate dbg --network testnet --fund
            ADDR=$(stellar keys address dbg)
            echo "caller: $ADDR"
            echo "=== attempt A: tuples as JSON arrays, i128 as strings ==="
            stellar contract invoke \
              --id "$(cat CONTRACT_ID.txt)" \
              --source-account dbg \
              --network testnet \
              -- create_expense \
              --creator "$ADDR" \
              --id "dbg-a-$(date +%s)" \
              --title "Debug expense" \
              --members '[["You","150000000"],["Bob","150000000"]]'
            echo "exit A: $?"
            echo "=== attempt B: tuples as maps ==="
            stellar contract invoke \
              --id "$(cat CONTRACT_ID.txt)" \
              --source-account dbg \
              --network testnet \
              -- create_expense \
              --creator "$ADDR" \
              --id "dbg-b-$(date +%s)" \
              --title "Debug expense" \
              --members '[{"0":"You","1":"150000000"},{"0":"Bob","1":"150000000"}]'
            echo "exit B: $?"
          } > /tmp/invoke.log 2>&1
          exit 0

      - name: Comment result on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/invoke.log', 'utf8'); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: '🤖 **Debug invoke result v2**\n\n```\n' + log.slice(-8000) + '\n```',
            });
