name: CI build debug

on:
  push:
    branches: [level-2-soroban]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build (same steps as Vercel)
        id: build
        run: |
          npm install --legacy-peer-deps 2>&1 | tee install.log
          echo "install_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          npm run build 2>&1 | tee build.log
          echo "build_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          echo "done"

      - name: Comment result on PR #1
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const installExit = '${{ steps.build.outputs.install_exit }}';
            const buildExit = '${{ steps.build.outputs.build_exit }}';
            let body = `**CI build debug** — install exit: ${installExit}, build exit: ${buildExit}\n`;
            for (const f of ['install.log', 'build.log']) {
              if (fs.existsSync(f)) {
                const lines = fs.readFileSync(f, 'utf8').split('\n');
                const tail = lines.slice(-120).join('\n');
                body += '\n<details><summary>' + f + ' (last 120 lines)</summary>\n\n```\n' + tail + '\n```\n</details>\n';
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: body.slice(0, 60000),
            });
