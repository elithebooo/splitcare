name: Hardening check

on:
  push:
    branches: [hardening-v2]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/splitcare

      - name: Frontend checks
        run: |
          set +e
          npm install --legacy-peer-deps --no-audit --no-fund > /tmp/install.log 2>&1
          echo "install exit: $?" > /tmp/frontend.log
          npm run typecheck > /tmp/typecheck.log 2>&1
          echo "typecheck exit: $?" >> /tmp/frontend.log
          npm run build > /tmp/build.log 2>&1
          echo "build exit: $?" >> /tmp/frontend.log
          {
            echo "--- typecheck tail ---"
            tail -n 15 /tmp/typecheck.log
            echo "--- build tail ---"
            tail -n 8 /tmp/build.log
          } >> /tmp/frontend.log
          exit 0

      - name: Contract tests
        run: |
          set +e
          cd contracts/splitcare
          # Force the transitive ed25519-dalek to 2.2.0: version 3.0 moved to
          # rand_core 0.10, which breaks soroban-env-host's ChaCha20Rng test
          # helpers (CryptoRng trait mismatch). The repo has no committed
          # Cargo.lock, so pin it here before testing.
          cargo generate-lockfile > /tmp/lock.log 2>&1
          cargo update -p ed25519-dalek --precise 2.2.0 >> /tmp/lock.log 2>&1
          cargo test > /tmp/contract-full.log 2>&1
          echo "cargo test exit: $?" > /tmp/contract.log
          grep -E "test result:|running [0-9]+ tests|error\[|^error|warning: unused" /tmp/contract-full.log | tail -n 30 >> /tmp/contract.log
          exit 0

      - name: Comment result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: '🤖 **Hardening check v3**\n\n```\n' + (read('/tmp/frontend.log') + '\n--- lock ---\n' + read('/tmp/lock.log') + '\n--- contract ---\n' + read('/tmp/contract.log')).slice(-4000) + '\n```',
            });
