name: Debug frontend sim

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-frontend-sim.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install sdk
        run: npm install --no-save --no-audit --no-fund --legacy-peer-deps @stellar/stellar-sdk@14.6.1 2>&1 | tail -n 3

      - name: Write sim script
        run: |
          cat > debug-sim.mjs <<'EOF'
          import { Address, BASE_FEE, Contract, Keypair, Networks, TransactionBuilder, nativeToScVal, rpc } from "@stellar/stellar-sdk";

          const CONTRACT_ID = process.env.CONTRACT_ID;
          const server = new rpc.Server("https://soroban-testnet.stellar.org");
          const kp = Keypair.random();
          const creator = kp.publicKey();
          console.log("creator:", creator);
          const fr = await fetch("https://friendbot.stellar.org/?addr=" + creator);
          console.log("friendbot status:", fr.status);

          const id = "jsdebug-" + Date.now();
          const title = "Debug expense";
          const shares = [
            { name: "You", amountStroops: 150000000n },
            { name: "Bob", amountStroops: 150000000n },
          ];

          const args = [
            new Address(creator).toScVal(),
            nativeToScVal(id, { type: "string" }),
            nativeToScVal(title, { type: "string" }),
            nativeToScVal(shares.map((s) => [s.name, s.amountStroops])),
          ];
          console.log("members xdr:", args[3].toXDR("base64"));

          const account = await server.getAccount(creator);
          const tx = new TransactionBuilder(account, { fee: BASE_FEE, networkPassphrase: Networks.TESTNET })
            .addOperation(new Contract(CONTRACT_ID).call("create_expense", ...args))
            .setTimeout(60)
            .build();

          const sim = await server.simulateTransaction(tx);
          console.log("isSuccess:", rpc.Api.isSimulationSuccess(sim));
          if (rpc.Api.isSimulationSuccess(sim)) {
            console.log("SIM OK");
          } else {
            console.log("SIM ERROR:");
            console.log(sim.error);
            console.log("FULL RESPONSE:");
            console.log(JSON.stringify(sim, null, 2).slice(0, 6000));
          }
          EOF
          echo written

      - name: Run sim
        run: CONTRACT_ID=$(cat CONTRACT_ID.txt) node debug-sim.mjs 2>&1 | tee sim-output.log

      - name: Comment result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('sim-output.log', 'utf8'); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: '🤖 **Frontend-path sim debug**\n\n```\n' + log.slice(-8000) + '\n```',
            });
