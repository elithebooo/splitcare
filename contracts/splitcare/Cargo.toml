[package]
name = "splitcare"
version = "0.2.0"
edition = "2021"
description = "SplitCare expense tracking contract for Stellar Soroban (testnet)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22"

[dev-dependencies]
soroban-sdk = { version = "22", features = ["testutils"] }
# Pin to 2.x: ed25519-dalek 3.0 moved to rand_core 0.10, which breaks the
# ChaCha20Rng-based test helpers in soroban-env-host (CryptoRng trait
# mismatch). 2.2.0 stays on rand_core 0.6, matching rand 0.8 / rand_chacha 0.3.
ed25519-dalek = "=2.2.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
